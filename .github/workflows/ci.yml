name: CI

on:
  push:
    branches: [main]
    # The release commit is pushed together with the next commit, so a push to main never builds it; the tag run does,
    # and preview-packages.yml releases its packages on pkg.earendil.com.
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Previews are published for main, release tags and PRs from branches of this repo only (see preview-packages.yml).
      - name: Pack preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          # Pull request runs check out a merge commit; tarballs are keyed by the PR head commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/preview-packages.mjs pack --sha "$SHA" --out "$RUNNER_TEMP/preview-packages"

      - name: Upload preview packages
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-packages
          path: ${{ runner.temp }}/preview-packages
          retention-days: 3
          if-no-files-found: error

      - name: Check
        run: npm run check

  # Tests are split across parallel jobs so the slowest suites do not run back to back.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coding-agent
          - name: durable
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies
        if: matrix.name != 'durable'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Build the pi-env daemon
        if: matrix.name == 'other'
        run: npm run build:daemon --workspace packages/env

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
        run: |
          if [ "$SUITE" != other ]; then
            npm run test --workspace "packages/$SUITE"
            exit 0
          fi
          # Every other workspace, so new packages are tested without editing this workflow.
          args=()
          for dir in packages/*/; do
            case "$dir" in packages/coding-agent/ | packages/durable/) continue ;; esac
            args+=(--workspace "${dir%/}")
          done
          npm run test:scripts
          npm run test --if-present "${args[@]}"

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs pi's MCP client from source against the pinned official conformance suite and fails on
      # regressions against packages/coding-agent/test/mcp-conformance/baseline.json.
      - name: MCP client conformance
        run: npm run test:mcp-conformance

  # Piper's offline hard gate (audit rework R8). Everything here runs without
  # live network access: the suites use local stubs and frozen fixtures, and the
  # regression suite runs against a temp data dir with a local GitHub stub.
  # regression:live is deliberately NOT part of CI.
  piper:
    name: piper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # apps/piper is a root workspace (apps/*) and its dependencies are in the
      # root lockfile, so the root install covers it.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # apps/piper imports @earendil-works/pi-agent-core and pi-ai, whose package
      # exports resolve to dist/. Build just that dependency chain, in the same
      # order as the root build: telemetry -> schema -> ai -> agent.
      - name: Build the pi base packages Piper imports
        run: npm run build --workspace @earendil-works/pi-telemetry --workspace @earendil-works/pi-schema --workspace @earendil-works/pi-ai --workspace @earendil-works/pi-agent-core

      # npm run test in apps/piper aggregates: build:web, check, all offline
      # test:* suites, eval:scan and the offline regression suite.
      - name: Piper offline suites
        working-directory: apps/piper
        run: npm run test
