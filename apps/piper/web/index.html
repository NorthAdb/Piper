<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Piper</title>
<script>
	// 防闪烁：首帧前按持久化主题给 html 加/去 .dark（缺省 dark，与 index.css 的
	// :root 深色缺省一致；key 与 web/src/theme.ts 约定相同，读取失败按缺省处理）
	var piperTheme = "dark";
	try {
		if (localStorage.getItem("piper-theme") === "light") piperTheme = "light";
	} catch {}
	document.documentElement.classList.toggle("dark", piperTheme === "dark");
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
