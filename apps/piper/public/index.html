<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Piper</title>
<style>
	* { box-sizing: border-box; }
	body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1c1e; }
	#login { max-width: 360px; margin: 15vh auto; padding: 24px; border: 1px solid #ddd; border-radius: 10px; }
	#app { display: none; height: 100vh; grid-template-columns: 240px 1fr 340px; }
	.col { overflow-y: auto; padding: 12px; }
	#bots-col { border-right: 1px solid #e3e3e6; display: flex; flex-direction: column; }
	#desk-col { border-left: 1px solid #e3e3e6; }
	.bot-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
	.bot-item.active { background: #eef2ff; }
	.dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; flex: none; }
	.dot.busy { background: #f59e0b; }
	#chat-col { display: flex; flex-direction: column; overflow: hidden; }
	#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
	.msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
	.msg.user { align-self: flex-end; background: #dbeafe; }
	.msg.assistant { align-self: flex-start; background: #f3f4f6; }
	details.card { align-self: flex-start; max-width: 85%; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
	.draft-card { align-self: flex-start; border: 1px solid #93c5fd; background: #eff6ff; border-radius: 10px; padding: 12px; max-width: 85%; }
	#composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e3e6; }
	#composer input { flex: 1; padding: 9px; }
	button { cursor: pointer; padding: 7px 12px; border: 1px solid #c7c7cc; border-radius: 7px; background: #fff; }
	button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
	.tabs { display: flex; gap: 4px; margin-bottom: 10px; }
	.tabs button.active { background: #111827; color: #fff; }
	pre.md { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: #f9fafb; padding: 10px; border-radius: 8px; }
	.muted { color: #6b7280; font-size: 13px; }
	.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); }
	.modal .box { background: #fff; max-width: 480px; margin: 8vh auto; padding: 20px; border-radius: 10px; }
	.modal label { display: block; margin: 10px 0 4px; font-size: 13px; color: #374151; }
	.modal input, .modal textarea { width: 100%; padding: 8px; }
</style>
</head>
<body>
<div id="login">
	<h2>Piper</h2>
	<p class="muted">单用户口令登录（本地开发默认 <code>piper-dev</code>，可用环境变量 PIPER_TOKEN 修改）。</p>
	<input id="token" type="password" placeholder="口令" style="width:100%;padding:9px" />
	<p><button class="primary" id="login-btn" style="width:100%">登录</button></p>
	<p class="muted" id="login-err"></p>
</div>

<div id="app">
	<aside class="col" id="bots-col">
		<h3 style="margin:4px 0 10px">Bots</h3>
		<div id="bot-list"></div>
		<p><button id="new-bot-btn" style="width:100%">＋ 新建 Bot</button></p>
		<div style="margin-top:auto">
			<button id="inbox-btn" style="width:100%">待批收件箱 <span id="inbox-count"></span></button>
			<div id="inbox-panel" class="muted" style="display:none;padding:8px 2px"></div>
		</div>
	</aside>

	<main id="chat-col">
		<div style="padding:10px 16px;border-bottom:1px solid #e3e3e6"><b id="chat-title">选择一个 bot 开始对话</b> <span class="muted" id="model-state"></span></div>
		<div id="messages"></div>
		<form id="composer">
			<input id="input" placeholder="输入消息；对主 bot 说「创建一个 XX bot，负责……」可生成草案卡" autocomplete="off" />
			<button class="primary" type="submit">发送</button>
		</form>
	</main>

	<aside class="col" id="desk-col">
		<div class="tabs">
			<button data-tab="routines" class="active">例程</button>
			<button data-tab="artifacts">产物</button>
			<button data-tab="memory">记忆</button>
		</div>
		<div id="tab-routines"></div>
		<div id="tab-artifacts" style="display:none"></div>
		<div id="tab-memory" style="display:none"></div>
	</aside>
</div>

<div class="modal" id="bot-modal">
	<div class="box">
		<h3 id="bot-form-title">新建 Bot</h3>
		<input type="hidden" id="f-id" />
		<label>名字</label><input id="f-name" />
		<label>职责描述（system prompt 主体）</label><textarea id="f-prompt" rows="4"></textarea>
		<label>可用工具集（逗号分隔）</label><input id="f-tools" placeholder="github.read" />
		<label>记忆范围</label><input id="f-memory" placeholder="self+about-me" />
		<label>绑定仓库（逗号分隔，owner/repo）</label><input id="f-repos" placeholder="NorthAdb/LinkForge" />
		<p style="display:flex;gap:8px;justify-content:flex-end">
			<button id="f-delete" style="display:none;color:#b91c1c">删除</button>
			<button id="f-cancel">取消</button>
			<button class="primary" id="f-save">保存</button>
		</p>
	</div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let bots = [], currentBotId = null, editingId = null;

async function api(path, opts = {}) {
	const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
	if (res.status === 401) { showLogin(); throw new Error("未登录"); }
	const data = await res.json().catch(() => ({}));
	if (!res.ok) throw new Error(data.error || res.status);
	return data;
}
function showLogin() { $("#login").style.display = "block"; $("#app").style.display = "none"; }
function showApp() { $("#login").style.display = "none"; $("#app").style.display = "grid"; }

$("#login-btn").onclick = async () => {
	const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: $("#token").value }) });
	if (res.ok) { showApp(); await boot(); } else $("#login-err").textContent = "口令不正确";
};

async function boot() {
	const s = await api("/api/session");
	$("#model-state").textContent = s.modelConfigured ? "（模型已配置）" : "（未配置模型：对话会明确提示，草案卡走规则兜底）";
	await loadBots();
	await loadRoutines(); await loadArtifacts(); await loadInbox();
	if (bots.length) selectBot(bots[0].id);
}

async function loadBots() {
	bots = (await api("/api/bots")).bots;
	const list = $("#bot-list"); list.innerHTML = "";
	for (const b of bots) {
		const d = document.createElement("div");
		d.className = "bot-item" + (b.id === currentBotId ? " active" : "");
		d.innerHTML = `<span class="dot"></span><span>${b.isMain ? "📌 " : ""}${escapeHtml(b.name)}</span><span class="muted" style="margin-left:auto">${b.repos?.length ? b.repos.length + " 仓" : ""}</span>`;
		d.onclick = () => selectBot(b.id);
		d.ondblclick = () => openBotForm(b);
		list.appendChild(d);
	}
}
function escapeHtml(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function selectBot(id) {
	currentBotId = id;
	const bot = bots.find((b) => b.id === id);
	$("#chat-title").textContent = bot ? `与「${bot.name}」对话` : "";
	await loadBots();
	const box = $("#messages"); box.innerHTML = "";
	const { messages } = await api(`/api/bots/${id}/messages`);
	for (const m of messages) renderEntry(m);
	box.scrollTop = box.scrollHeight;
	await loadMemory();
}

function renderEntry(m) {
	const box = $("#messages");
	if (m.role === "user" || m.role === "assistant") {
		const d = document.createElement("div");
		d.className = "msg " + m.role; d.textContent = m.text || "";
		box.appendChild(d);
	} else if (m.kind === "draft" && m.draft) {
		box.appendChild(draftCard(m.draft, true));
	} else {
		const d = document.createElement("details");
		d.className = "card";
		d.innerHTML = `<summary>${escapeHtml(m.kind || "system")}</summary><div>${escapeHtml(m.text || "")}</div>`;
		box.appendChild(d);
	}
	box.scrollTop = box.scrollHeight;
}

function draftCard(draft, readOnly = false) {
	const d = document.createElement("div");
	d.className = "draft-card";
	d.innerHTML = `<b>Bot 草案卡</b>（未确认不会创建）<br>名字：${escapeHtml(draft.name)}<br>职责：${escapeHtml(draft.systemPrompt)}<br>工具：${escapeHtml((draft.tools || []).join(", ") || "无")}<br>绑定仓库：${escapeHtml((draft.repos || []).join(", ") || "无")}`;
	if (!readOnly) {
		const row = document.createElement("p"); row.style.display = "flex"; row.style.gap = "8px";
		const ok = document.createElement("button"); ok.className = "primary"; ok.textContent = "确认创建";
		ok.onclick = async () => { const { bot } = await api("/api/bots/draft-confirm", { method: "POST", body: JSON.stringify({ draft }) }); d.remove(); await loadBots(); selectBot(bot.id); };
		const no = document.createElement("button"); no.textContent = "放弃"; no.onclick = () => d.remove();
		row.append(ok, no); d.appendChild(row);
	}
	return d;
}

$("#composer").onsubmit = async (e) => {
	e.preventDefault();
	const text = $("#input").value.trim();
	if (!text || !currentBotId) return;
	$("#input").value = "";
	renderEntry({ role: "user", text });
	const botEl = [...document.querySelectorAll(".bot-item")].find((el) => el.textContent.includes(bots.find((b) => b.id === currentBotId)?.name));
	const bubble = document.createElement("div"); bubble.className = "msg assistant"; bubble.textContent = "";
	$("#messages").appendChild(bubble);
	const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ botId: currentBotId, message: text }) });
	const reader = res.body.getReader(); const decoder = new TextDecoder();
	let buf = "", gotText = false;
	while (true) {
		const { done, value } = await reader.read(); if (done) break;
		buf += decoder.decode(value, { stream: true });
		let idx;
		while ((idx = buf.indexOf("\n\n")) >= 0) {
			const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
			const ev = /event: (.*)/.exec(chunk)?.[1]; const data = JSON.parse(/data: (.*)/s.exec(chunk)?.[1] || "{}");
			if (ev === "delta") { gotText = true; bubble.textContent += data.text; }
			else if (ev === "tool") { const c = document.createElement("details"); c.className = "card"; c.innerHTML = `<summary>工具事件：${escapeHtml(data.name)}（${escapeHtml(data.phase)}）</summary><pre>${escapeHtml(JSON.stringify(data.detail, null, 2))}</pre>`; $("#messages").appendChild(c); }
			else if (ev === "system") { const c = document.createElement("details"); c.className = "card"; c.open = true; c.innerHTML = `<summary>系统</summary><div>${escapeHtml(data.text)}</div>`; $("#messages").appendChild(c); }
			else if (ev === "draft") { $("#messages").appendChild(draftCard(data.draft)); }
			else if (ev === "error") { bubble.textContent = (bubble.textContent || "") + `\n[${data.code}] ${data.message}`; }
		}
		if (botEl) botEl.querySelector(".dot")?.classList.add("busy");
	}
	if (botEl) botEl.querySelector(".dot")?.classList.remove("busy");
	if (!gotText && !bubble.textContent) bubble.remove();
	$("#messages").scrollTop = $("#messages").scrollHeight;
};

// ---------- 右栏 ----------
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
	document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
	for (const t of ["routines", "artifacts", "memory"]) $("#tab-" + t).style.display = t === b.dataset.tab ? "block" : "none";
});

async function loadRoutines() {
	const { routines } = await api("/api/routines");
	const el = $("#tab-routines"); el.innerHTML = "";
	for (const r of routines) {
		const d = document.createElement("div");
		d.innerHTML = `<b>${escapeHtml(r.name)}</b><p class="muted">${escapeHtml(r.description)}<br>计划：${escapeHtml(r.schedule)}<br>上次运行：${r.lastRunAt || "从未"} ${r.lastStatus ? "（" + r.lastStatus + "）" : ""}</p>`;
		const btn = document.createElement("button"); btn.className = "primary"; btn.textContent = "立即运行";
		btn.onclick = async () => { btn.disabled = true; btn.textContent = "运行中…"; await api("/api/routines/morning-scan/run", { method: "POST", body: "{}" }); btn.disabled = false; btn.textContent = "立即运行"; await loadRoutines(); await loadArtifacts(); };
		d.appendChild(btn); el.appendChild(d);
	}
	if (!routines.length) el.innerHTML = '<p class="muted">暂无例程</p>';
}

async function loadArtifacts() {
	const { artifacts } = await api("/api/artifacts");
	const el = $("#tab-artifacts"); el.innerHTML = artifacts.length ? "" : '<p class="muted">暂无产物，运行一次晨间扫描试试。</p>';
	for (const a of artifacts) {
		const d = document.createElement("div");
		d.innerHTML = `<a href="javascript:void 0">${escapeHtml(a.title)}</a> <span class="muted">${(a.createdAt || "").slice(0, 10)}</span><pre class="md" style="display:none"></pre>`;
		d.querySelector("a").onclick = async () => { const { artifact } = await api(`/api/artifacts/${a.id}`); const pre = d.querySelector("pre"); pre.textContent = artifact.body; pre.style.display = pre.style.display === "none" ? "block" : "none"; };
		el.appendChild(d);
	}
}

async function loadMemory() {
	if (!currentBotId) return;
	const data = await api(`/api/memory/${currentBotId}`);
	$("#tab-memory").innerHTML = `<p class="muted">该 bot 的记忆（雏形只读）：</p><pre class="md">${escapeHtml(data.markdown || "（暂无 memory.md）")}</pre><p class="muted">账号级「关于我」（全 bot 可读、仅主 bot 可写）：</p><pre class="md">${escapeHtml(data.aboutMe)}</pre>`;
}

async function loadInbox() {
	const { approvals } = await api("/api/approvals");
	$("#inbox-count").textContent = approvals.length ? `(${approvals.length})` : "";
	$("#inbox-panel").textContent = approvals.length ? "" : "暂无待批请求。权限网关在后续迭代接入，写操作请求会汇集到这里。";
}
$("#inbox-btn").onclick = () => { const p = $("#inbox-panel"); p.style.display = p.style.display === "none" ? "block" : "none"; };

// ---------- bot 表单 ----------
function openBotForm(bot) {
	editingId = bot?.id || null;
	$("#bot-form-title").textContent = bot ? `编辑「${bot.name}」` : "新建 Bot";
	$("#f-id").value = bot?.id || ""; $("#f-name").value = bot?.name || ""; $("#f-prompt").value = bot?.systemPrompt || "";
	$("#f-tools").value = (bot?.tools || []).join(", "); $("#f-memory").value = bot?.memoryScope || "self+about-me";
	$("#f-repos").value = (bot?.repos || []).join(", ");
	$("#f-delete").style.display = bot && !bot.isMain ? "inline-block" : "none";
	$("#bot-modal").style.display = "block";
}
$("#new-bot-btn").onclick = () => openBotForm(null);
$("#f-cancel").onclick = () => ($("#bot-modal").style.display = "none");
$("#f-save").onclick = async () => {
	const payload = { name: $("#f-name").value, systemPrompt: $("#f-prompt").value, tools: $("#f-tools").value.split(",").map((s) => s.trim()).filter(Boolean), memoryScope: $("#f-memory").value, repos: $("#f-repos").value.split(",").map((s) => s.trim()).filter(Boolean) };
	if (editingId) await api(`/api/bots/${editingId}`, { method: "PUT", body: JSON.stringify(payload) });
	else await api("/api/bots", { method: "POST", body: JSON.stringify(payload) });
	$("#bot-modal").style.display = "none"; await loadBots();
};
$("#f-delete").onclick = async () => { if (editingId && confirm("确认删除这个 bot？")) { await api(`/api/bots/${editingId}`, { method: "DELETE" }); $("#bot-modal").style.display = "none"; currentBotId = null; await loadBots(); if (bots.length) selectBot(bots[0].id); } };

api("/api/session").then(() => { showApp(); boot(); }).catch(() => showLogin());
</script>
</body>
</html>
